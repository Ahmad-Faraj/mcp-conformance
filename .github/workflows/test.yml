name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      # The probe against known servers, the classifiers, the interval arithmetic,
      # and the guards on the released dataset.
      - run: python -m pytest tests/ -q
      # Every number in the paper must regenerate from the release unchanged.
      - run: python reproduce.py --verify
